name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Fix XML Headers
        run: |
          sed -i 's|<manifest.*|<manifest xmlns:android="http://android.com">|g' app/src/main/AndroidManifest.xml
          sed -i 's|<LinearLayout xmlns:android=.*|<LinearLayout xmlns:android="http://android.com"|g' app/src/main/res/layout/activity_main.xml
          sed -i 's|<LinearLayout xmlns:android=.*|<LinearLayout xmlns:android="http://android.com"|g' app/src/main/res/layout/layout_bubble.xml
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempelJawab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
